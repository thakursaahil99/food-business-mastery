<title>Redbean App Looks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* Layout: a chooser page. Top: view switch. Body: a grid of scaled phone mockups. Bottom: fixed "your choice" bar. */
:root{
  --c-bg:#f4f2ef; --c-surface:#ffffff; --c-fg:#18171a; --c-muted:#65616a; --c-line:#e3dfd9;
  --c-accent:#d91124; --c-accent-fg:#ffffff; --c-soft:#fbe9eb;
  --f-ui:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --c-bg:#111013; --c-surface:#1b1a1e; --c-fg:#f1eff2; --c-muted:#a39fa8; --c-line:#2f2d34;
    --c-accent:#ef2f3f; --c-accent-fg:#ffffff; --c-soft:#2c1619; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --c-bg:#111013; --c-surface:#1b1a1e; --c-fg:#f1eff2; --c-muted:#a39fa8; --c-line:#2f2d34;
  --c-accent:#ef2f3f; --c-accent-fg:#ffffff; --c-soft:#2c1619; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--c-bg);color:var(--c-fg);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 150px}
.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--c-accent)}
.top h1{font-size:clamp(26px,4vw,38px);line-height:1.1;letter-spacing:-.02em;margin:6px 0 8px;text-wrap:balance}
.lede{color:var(--c-muted);max-width:64ch;margin:0}
.views{display:flex;background:var(--c-line);padding:4px;border-radius:12px;gap:4px}
.views button{border:0;background:transparent;height:40px;padding:0 16px;border-radius:9px;font-weight:600;color:var(--c-muted)}
.views button[aria-selected="true"]{background:var(--c-surface);color:var(--c-fg);box-shadow:0 1px 2px rgb(0 0 0/.08)}

.looks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:1000px){.looks{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:680px){.looks{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:440px){.looks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lk-btn{display:flex;align-items:center;gap:10px;min-height:56px;padding:9px 11px;border-radius:12px;border:1px solid var(--c-line);background:var(--c-surface);text-align:left;min-width:0}
.lk-btn:hover{border-color:var(--c-muted)}
.lk-btn[aria-checked="true"]{border-color:var(--c-accent);box-shadow:0 0 0 1px var(--c-accent)}
.sw{width:32px;height:32px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px rgb(0 0 0/.08)}
.lk-txt{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.lk-n{font-size:12px;color:var(--c-muted);display:flex;gap:6px;align-items:center}
.lk-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick{color:var(--c-accent);font-weight:700}

.look-head{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin:18px 0 22px;padding:18px 20px;background:var(--c-surface);border:1px solid var(--c-line);border-radius:16px}
.look-head h2{margin:0;font-size:22px;letter-spacing:-.01em}
.look-head p{margin:2px 0 10px;color:var(--c-muted);max-width:62ch}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--c-bg);color:var(--c-muted)}
.fact b{color:var(--c-fg);font-weight:600}
.pick{height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--c-accent);color:var(--c-accent-fg);font-weight:600;white-space:nowrap}
.pick[aria-pressed="true"]{background:var(--c-fg);color:var(--c-bg)}

.screens{display:flex;flex-wrap:wrap;gap:8px}
.screens button{height:42px;padding:0 16px;border-radius:99px;border:1px solid var(--c-line);background:var(--c-surface);font-weight:600}
.screens button[aria-selected="true"]{background:var(--c-fg);color:var(--c-bg);border-color:var(--c-fg)}
.improve{margin:18px 0 22px;padding:18px 20px;background:var(--c-surface);border:1px solid var(--c-line);border-radius:16px}
.improve h2{margin:0;font-size:17px}
.improve ul{margin:8px 0 0;padding-left:18px;columns:2 300px;column-gap:36px;color:var(--c-muted)}
.improve li{margin:3px 0;break-inside:avoid}

.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:30px 20px}
.g6{--cols:7}
@media (max-width:1399px){.g6{--cols:4}}
@media (max-width:759px){.g6{--cols:2}}
@media (max-width:519px){.g6{--cols:1}}
.g12{--cols:6}
@media (max-width:1279px){.g12{--cols:4}}
@media (max-width:999px){.g12{--cols:3}}
@media (max-width:759px){.g12{--cols:2}}
@media (max-width:519px){.g12{--cols:1}}
.cell{display:flex;flex-direction:column;gap:10px;min-width:0}
.cap{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;width:calc(360px*var(--s,.6));max-width:100%;margin-inline:auto}
.cap-t{min-width:0;line-height:1.3}
.cap-t b{display:block;font-weight:600}
.cap-t span{font-size:13px;color:var(--c-muted)}
.use{flex:none;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--c-line);background:var(--c-surface);font-size:13px;font-weight:600}
.use[aria-pressed="true"]{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-accent-fg)}
.slot{width:calc(360px*var(--s,.6));height:calc(740px*var(--s,.6));margin-inline:auto;max-width:100%}

.choice{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--c-surface);border-top:1px solid var(--c-line);box-shadow:0 -8px 24px -12px rgb(0 0 0/.18);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.choice-in{max-width:1480px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.ch-l{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted)}
#ch-sum{margin:0;font-weight:600}
.ch-act{display:flex;gap:8px}
.ch-act button{height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--c-line);background:var(--c-surface);font-weight:600}
#ch-copy{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-accent-fg)}
#ch-fallback{width:100%;font:inherit;font-size:13px;padding:8px;border-radius:8px;border:1px solid var(--c-line);background:var(--c-bg);color:var(--c-fg)}

/* ---------- Phone mockup ---------- */
.dev{width:360px;height:740px;transform:scale(var(--s,.6));transform-origin:0 0;border-radius:56px;background:#0b0b0d;padding:8px;box-shadow:0 0 0 1.5px #34343a inset,0 24px 50px -24px rgb(0 0 0/.45)}
.ph{width:344px;height:724px;border-radius:48px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:calc(14px*var(--fs));line-height:1.4;-webkit-font-smoothing:antialiased}
.ph *{box-sizing:border-box}
.ph::before{content:"";position:absolute;top:11px;left:50%;width:94px;height:27px;margin-left:-47px;background:#000;border-radius:20px;z-index:6}
.ph h1{font-family:var(--head);font-size:1.75em;line-height:1.15;font-weight:700;margin:0;letter-spacing:-.01em}
.ph h2{font-family:var(--head);font-size:1.15em;line-height:1.25;font-weight:700;margin:0}
.ph p{margin:0}
.ph .ic{flex:none;display:block}
.sb{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0;font:700 14px/1 system-ui,sans-serif;z-index:5;color:var(--fg)}
.sb-l{color:#fff}
.sb-r{display:flex;gap:6px;align-items:center}
.sg{width:17px;height:11px;background:currentColor;clip-path:polygon(0 100%,100% 0,100% 100%)}
.bt{width:24px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative}
.bt::after{content:"";position:absolute;inset:1.5px 6px 1.5px 1.5px;background:currentColor;border-radius:1.5px}
.scr{flex:1;min-height:0;overflow:hidden;position:relative}
.mt{color:var(--muted)}
.sm{font-size:.88em}
.xs{font-size:.78em}
.ctr{text-align:center}
.acc{color:var(--accent)}
.big{font-family:var(--head);font-size:1.6em;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.big .mt{font-size:.6em;font-weight:600}
.ttl{font-weight:700;line-height:1.28}
.lbl{font-size:.76em;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.hd{padding:52px 18px 16px;position:relative}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:.88em;font-weight:600}
.hd .sub{margin-top:5px;color:var(--muted);font-size:.95em}
.help{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:99px;font-weight:700;font-size:.92em;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--fg)}
.help-d{background:rgb(255 255 255/.14);box-shadow:none;color:#fff}
.hd-dark{background:var(--hero);color:var(--heroFg);border-radius:0 0 30px 30px;padding-bottom:20px}
.hd-dark .sub,.hd-dark .mt{color:var(--heroMuted)}
.hd-curve{background:linear-gradient(155deg,var(--accent),var(--accent2));color:#fff;border-radius:0 0 36px 36px;padding-bottom:62px}
.hd-curve .sub{color:rgb(255 255 255/.82)}
.hd-curve + .bd{margin-top:-46px}
.hd-photo{color:#fff;min-height:220px;display:flex;flex-direction:column;justify-content:space-between;background-size:cover;background-position:center;border-radius:0 0 28px 28px}
.hd-photo .sub{color:rgb(255 255 255/.85)}
.hd-centered{text-align:center;padding-bottom:6px}
.hd-centered .hd-top{text-align:left}
.is-dark .hd-plain .help,.is-dark .hd-centered .help{background:var(--surface);color:var(--fg)}

.bd{padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px;position:relative}
.card{background:var(--surface);border-radius:var(--r);padding:14px}
.tight{padding:12px 14px}
.c-shadow{box-shadow:0 1px 2px rgb(0 0 0/.05),0 8px 22px -10px rgb(0 0 0/.2)}
.c-outline{box-shadow:inset 0 0 0 var(--bw) var(--line)}
.c-tint{background:var(--tint)}
.c-flat{}
.dk{background:var(--hero);color:var(--heroFg)}
.dk .mt{color:var(--heroMuted)}
.dk .bar{background:rgb(255 255 255/.16)}
.is-dark .dk{box-shadow:inset 0 0 0 1px var(--accentLine)}
.nc-in{margin-top:16px;padding:14px;border-radius:calc(var(--r)*.8);background:rgb(255 255 255/.07);box-shadow:inset 0 0 0 1px rgb(255 255 255/.1)}
.hd-photo .nc-in{background:rgb(0 0 0/.35)}
.nc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cd{display:inline-flex;align-items:center;gap:5px;font-size:.85em;font-weight:700}
.nc-t{font-size:1.25em}
.nc-a{display:grid;grid-template-columns:1.35fr 1fr;gap:8px;margin-top:12px;margin-bottom:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 14px;border-radius:calc(var(--r)*.62);background:var(--accent);color:var(--accentFg);font-weight:700;font-size:1em;white-space:nowrap}
.btn-o{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-w{background:rgb(255 255 255/.14);color:inherit}
.btn-sm{height:40px;font-size:.9em;padding:0 12px}
.icb{width:42px;height:42px;border-radius:calc(var(--r)*.6);display:grid;place-items:center;background:var(--tint);color:var(--accent);flex:none}
.c-tint .icb{background:var(--surface)}
.icb.s{width:36px;height:36px}
.play{width:44px;height:44px;border-radius:99px;background:var(--accent);color:var(--accentFg);display:grid;place-items:center;flex:none}
.img{background-size:cover;background-position:center;border-radius:calc(var(--r)*.6);flex:none}
.pl{display:inline-flex;align-items:center;gap:4px;height:25px;padding:0 10px;border-radius:99px;font-size:.78em;font-weight:700;white-space:nowrap}
.pl-live{background:var(--accent);color:var(--accentFg)}
.pl-ok{background:var(--okBg);color:var(--ok)}
.pl-bad{background:var(--badBg);color:var(--bad)}
.pl-warn{background:var(--warnBg);color:var(--warn)}
.pl-mut{background:var(--track);color:var(--fg)}
.dk .pl-mut{background:rgb(255 255 255/.14);color:inherit}
.bar{height:7px;border-radius:9px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.seg{display:flex;background:var(--track);border-radius:14px;padding:4px;gap:4px}
.seg span{flex:1;text-align:center;padding:9px 4px;border-radius:10px;font-weight:700;font-size:.9em;color:var(--muted);white-space:nowrap}
.seg .on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.is-dark .seg .on{background:#2a2c35}
.chips{display:flex;gap:6px;overflow:hidden}
.chip{height:34px;padding:0 13px;border-radius:99px;display:inline-flex;align-items:center;font-size:.86em;font-weight:700;white-space:nowrap;box-shadow:inset 0 0 0 1.5px var(--line)}
.chip.on{background:var(--fg);color:var(--bg);box-shadow:none}
.lnk{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:700;font-size:.88em}

/* tab bars */
.tb{flex:none;display:flex;justify-content:space-around;align-items:center;padding:8px 6px 24px;background:var(--navBg);position:relative;z-index:2}
.ti{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.8em;font-weight:700;color:var(--navFg);flex:1;min-width:0;white-space:nowrap}
.ip{padding:4px 14px;border-radius:99px;display:grid;place-items:center}
.tb-pill .on{color:var(--navOn)}
.tb-pill .on .ip{background:var(--pill)}
.tb-line{box-shadow:0 -1px 0 var(--line)}
.tb-line .ti{position:relative;padding-top:4px}
.tb-line .on{color:var(--navOn)}
.tb-line .on::before{content:"";position:absolute;top:-8px;left:26%;right:26%;height:3px;border-radius:0 0 4px 4px;background:var(--navOn)}
.tb-float{margin:0 12px 22px;border-radius:26px;padding:7px;box-shadow:0 12px 30px -10px rgb(0 0 0/.4),0 0 0 1px rgb(0 0 0/.04)}
.tb-float .ti{padding:5px 0 6px;border-radius:19px}
.tb-float .ip{padding:2px 0}
.tb-float .on{background:var(--pill);color:var(--navOn)}
.tb-soft{box-shadow:0 -1px 0 var(--line)}
.tb-soft .on{color:var(--navOn)}
.tb-soft .on .ip{background:var(--pill)}
.tb-big{padding:8px 8px 24px;gap:4px}
.tb-big .ti{font-size:.86em;padding:8px 0 7px;border-radius:16px}
.tb-big .ip{padding:2px 0}
.tb-big .on{background:var(--pill);color:var(--navOn)}

/* home: week dots + timeline */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px}
.wd b{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;font-size:.9em;font-weight:700;background:var(--track)}
.wd.ok b{background:var(--okBg);color:var(--ok)}
.wd.bad b{background:var(--badBg);color:var(--bad)}
.wd.today b{background:var(--accent);color:var(--accentFg)}
.tl{display:flex;flex-direction:column;gap:10px;position:relative}
.tl::before{content:"";position:absolute;left:75px;top:18px;bottom:18px;width:2px;background:var(--line)}
.tli{display:grid;grid-template-columns:62px 14px 1fr;gap:8px;align-items:start}
.tlt{font-size:.8em;font-weight:700;color:var(--muted);padding-top:13px;text-align:right;white-space:nowrap}
.tld{width:12px;height:12px;border-radius:99px;margin-top:16px;background:var(--bg);box-shadow:inset 0 0 0 2.5px var(--line);position:relative;z-index:1}
.tli.now .tld{box-shadow:inset 0 0 0 3.5px var(--accent)}
.tli.done .tld{background:var(--ok);box-shadow:none}
.tlc{padding:12px}

/* classes */
.ds{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dsd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:14px;font-size:.76em;color:var(--muted);font-weight:700}
.dsd b{font-size:1.4em;color:var(--fg);line-height:1.1}
.dsd i{width:6px;height:6px;border-radius:9px}
.dsd.ok i{background:var(--ok)}
.dsd.bad i{background:var(--bad)}
.dsd.on{background:var(--accent);color:var(--accentFg)}
.dsd.on b{color:inherit}
.dsd.on i{background:currentColor}
.dt{width:48px;flex:none;text-align:center;border-radius:12px;background:var(--track);padding:6px 0;display:flex;flex-direction:column}
.c-tint .dt{background:var(--surface)}
.dt b{font-size:1.3em;line-height:1.05;font-family:var(--head)}
.dt span{font-size:.7em;font-weight:700;color:var(--muted);text-transform:uppercase}
.ag{display:flex;gap:12px}
.agd{width:42px;flex:none;text-align:center;padding-top:6px}
.agd b{display:block;font-size:1.6em;line-height:1;font-family:var(--head)}
.agd span{font-size:.72em;font-weight:700;color:var(--muted)}
.agd.on b{color:var(--accent)}
.kind{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}

/* learn */
.cv{aspect-ratio:16/8;background-size:cover;background-position:center;position:relative}
.cv .pl{position:absolute;left:10px;top:10px;background:rgb(0 0 0/.62);color:#fff}
.flush{padding:0;overflow:hidden}
.pad{padding:12px 14px 14px}
.vid{aspect-ratio:16/9;background-size:cover;background-position:center;position:relative;display:grid;place-items:center}
.vid .play{width:58px;height:58px;box-shadow:0 6px 20px rgb(0 0 0/.35)}
.vbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgb(255 255 255/.3)}
.vbar i{display:block;height:100%;width:60%;background:var(--accent)}
.vtime{position:absolute;right:10px;bottom:12px;font-size:.78em;font-weight:700;color:#fff;background:rgb(0 0 0/.55);padding:2px 7px;border-radius:6px}
.mod{display:flex;align-items:center;gap:10px;padding:10px 0}
.mod + .mod{box-shadow:0 -1px 0 var(--line)}
.ls{display:flex;align-items:center;gap:10px;padding:7px 0 7px 6px;font-size:.92em}
.lsi{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;flex:none;background:var(--track);color:var(--muted)}
.lsi.ok{background:var(--okBg);color:var(--ok)}
.lsi.cur{background:var(--accent);color:var(--accentFg)}

/* homework */
.cbx{width:28px;height:28px;border-radius:99px;box-shadow:inset 0 0 0 2px var(--line);flex:none;display:grid;place-items:center}
.cbx.on{background:var(--ok);color:#fff;box-shadow:none}
.drop{border:2px dashed var(--line);border-radius:calc(var(--r)*.7);padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-weight:600;text-align:center}

  <h1>${t("Namaste!", "नमस्ते!")}</h1><p class="lc-sub">${t("Learn to win food contracts with Bobby Singh", "बॉबी सिंह जी के साथ फ़ूड कॉन्ट्रैक्ट जीतना सीखें")}</p></div>
  <div class="card c-shadow lc-card form">${loginForm("h2")}</div>
  <div class="lc-foot"><span class="help">${ic("phone", 15)}${t("Call us", "कॉल करें")}</span><span class="help">${ic("chat", 15)}WhatsApp</span></div>` });

R.login.photo = () => ({ light: true, html: `<div class="lp" style="background-image:linear-gradient(180deg,rgb(8 6 8/.6),rgb(8 6 8/.1) 38%,rgb(8 6 8/.78)),url(${IMG.group})">
  <div class="hd-top"><span class="row" style="gap:9px;color:#fff">${mark("mk-sm")}<b>Redbean Academy</b></span>${lang(true)}</div>
  <div><p class="lp-k">${t("20+ years · 350+ success stories", "20+ साल · 350+ सफल कहानियाँ")}</p><h1>${t("Win your first food contract", "अपना पहला फ़ूड कॉन्ट्रैक्ट जीतें")}</h1></div></div>
  <div class="lp-sheet form">${loginForm("h2")}</div>` });

R.login.card = () => ({ light: !!C.dark, html: `<div class="lk"><div class="hd-top"><span class="back">${ic("back", 18)}${t("Back", "वापस")}</span>${lang(false)}</div>
  <div class="card c-${C.card === "flat" ? "shadow" : C.card} lk-card">${mark("mk-md")}<h1 style="font-size:1.5em">${t("Enter your code", "अपना कोड डालें")}</h1>
  <p class="mt">${t("We sent a 6-digit code on WhatsApp to +91 98765 43210.", "WhatsApp पर +91 98765 43210 को 6 अंकों का कोड भेजा है।")}</p>
  <div class="otp"><span>1</span><span>2</span><span>3</span><span>4</span><span class="f"></span><span></span></div>
  <p class="mt sm">${t("Resend code in 0:24", "0:24 में दोबारा भेजें")}</p>
  <span class="btn">${t("Verify and sign in", "जाँचें और लॉगिन करें")}</span>
  <p class="sm"><b class="acc">${t("Change number", "नंबर बदलें")}</b></p></div>
  <p class="ctr mt sm">${t("Step 2 of 2 · code step", "चरण 2 / 2 · कोड")}</p></div>` });

/* ---------- phone ---------- */
function tabbar(active) {
  const items = [["home", "home", t("Home", "होम")], ["classes", "video", t("Classes", "क्लास")], ["learn", "play", t("Learn", "सीखें")], ["homework", "doc", t("Homework", "होमवर्क")], ["more", "menu", t("More", "और")]];
  return `<div class="tb tb-${C.ns}">${items.map(([id, icn, l]) => `<span class="ti ${id === active ? "on" : ""}"><span class="ip">${ic(icn, 22)}</span><span>${l}</span></span>`).join("")}</div>`;
}
function vars(d) {
  const s = d.dark ? DARK_SEM : LIGHT_SEM;
  const v = { bg: d.bg, surface: d.surface, fg: d.fg, muted: d.muted, line: d.line, accent: d.accent, accent2: d.accent2, accentFg: d.accentFg, tint: d.tint,
    hero: d.hero, heroFg: d.heroFg, heroMuted: d.heroMuted, navBg: d.navBg, navFg: d.navFg, navOn: d.navOn, pill: d.pill, accentLine: d.accentLine || "transparent", ...s };
  return Object.entries(v).map(([k, x]) => `--${k}:${x}`).join(";") + `;--font:${d.font};--head:${d.head || d.font};--fs:${d.fs || 1};--r:${d.r}px;--bw:${d.bw || 1}px`;
}
function phone(d, s) {
  C = d;
  const out = R[s][d[KEY[s]]]();
  const html = typeof out === "string" ? out : out.html;
  const light = typeof out === "string" ? (["dark", "curve", "photo"].includes(d.header) || !!d.dark) : out.light;
  return `<div class="dev" role="img" aria-label="${d.name}, ${s} screen"><div class="ph ${d.dark ? "is-dark" : ""}" style="${vars(d)}">
    <div class="sb ${light ? "sb-l" : ""}"><span>9:41</span><span class="sb-r"><i class="sg"></i><i class="bt"></i></span></div>
    <div class="scr">${html}</div>${s === "login" ? "" : tabbar(s === "certificate" ? "more" : s)}</div></div>`;
}

/* ---------- page state ---------- */
const STORE = "rb_app_looks_v1";
const state = { view: "design", look: 1, screen: "home", all: null, per: {} };
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || "null");
  if (saved) Object.assign(state, { look: saved.look || 1, screen: saved.screen || "home", all: saved.all ?? null, per: saved.per || {}, view: saved.view || "design" });
} catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

const $ = (id) => document.getElementById(id);
const lookById = (id) => LOOKS.find((l) => l.id === id);
const swatch = (l) => `background:linear-gradient(135deg,${l.hero} 0 48%,${l.accent} 48% 100%)`;

function renderLooks() {
  $("looks").innerHTML = LOOKS.map((l) => `<button type="button" class="lk-btn" role="radio" aria-checked="${l.id === state.look}" data-look="${l.id}">
    <span class="sw" style="${swatch(l)}"></span><span class="lk-txt"><span class="lk-n">Look ${l.id}${state.all === l.id ? ` <span class="tick">✓ picked</span>` : ""}</span><span class="lk-name">${l.name}</span></span></button>`).join("");
  const l = lookById(state.look);
  const picked = state.all === l.id;
  $("look-head").innerHTML = `<div style="min-width:0;flex:1 1 380px"><h2>Look ${l.id} · ${l.name}</h2><p>${l.tag}</p>
    <div class="facts"><span class="fact">Font <b>${l.fontName}</b></span><span class="fact">Top <b>${FACT.header[l.header]}</b></span><span class="fact">Menu <b>${FACT.ns[l.ns]}</b></span><span class="fact">Cards <b>${FACT.card[l.card]}</b></span>${l.hi ? `<span class="fact"><b>Hindi first</b></span>` : ""}${l.dark ? `<span class="fact"><b>Dark mode</b></span>` : ""}</div></div>
    <button type="button" class="pick" data-pick-all="${l.id}" aria-pressed="${picked}">${picked ? "✓ Picked for the whole app" : "Use this look for the whole app"}</button>`;
  $("g-design").innerHTML = SCREENS.map((s) => `<div class="cell"><div class="cap"><span class="cap-t"><b>${s.name}</b></span></div><div class="slot">${phone(l, s.id)}</div></div>`).join("");
}

function renderScreens() {
  $("screens").innerHTML = SCREENS.map((s) => `<button type="button" role="tab" aria-selected="${s.id === state.screen}" data-screen="${s.id}">${s.name}</button>`).join("");
  const sc = SCREENS.find((s) => s.id === state.screen);
  $("improve").innerHTML = `<h2>What is better on ${sc.name}, in every look</h2><ul>${IMPROVE[sc.id].map((x) => `<li>${x}</li>`).join("")}</ul>`;
  $("g-screen").innerHTML = LOOKS.map((l) => {
    const on = state.per[sc.id] === l.id;
    return `<div class="cell"><div class="cap"><span class="cap-t"><b>Look ${l.id}</b><span>${l.name}</span></span><button type="button" class="use" data-pick-screen="${l.id}" aria-pressed="${on}" aria-label="Use Look ${l.id} for ${sc.name}">${on ? "✓ Chosen" : "Choose"}</button></div><div class="slot">${phone(l, sc.id)}</div></div>`;
  }).join("");
}

function summary() {
  const parts = [];
  if (state.all) parts.push(`Whole app: Look ${state.all} (${lookById(state.all).name})`);
  SCREENS.forEach((s) => { const id = state.per[s.id]; if (id && id !== state.all) parts.push(`${s.name}: Look ${id} (${lookById(id).name})`); });
  return parts;
}
function renderChoice() {
  const p = summary();
  $("ch-sum").textContent = p.length ? p.join(" · ") : "Nothing picked yet. Choose a look, or pick per screen.";
  $("ch-copy").disabled = !p.length;
  $("ch-copy").style.opacity = p.length ? "1" : ".5";
}

function render() {
  const d = state.view === "design";
  $("by-design").hidden = !d; $("by-screen").hidden = d;
  $("v-design").setAttribute("aria-selected", d); $("v-screen").setAttribute("aria-selected", !d);
  if (d) renderLooks(); else renderScreens();
  renderChoice();
  fit();
}

/* Scale phones to the grid column width. */
function fit() {
  document.querySelectorAll(".grid").forEach((g) => {
    if (g.offsetParent === null) return;
    const cols = parseInt(getComputedStyle(g).getPropertyValue("--cols")) || 1;
    const gap = parseFloat(getComputedStyle(g).columnGap) || 20;
    const w = (g.clientWidth - gap * (cols - 1)) / cols;
    g.style.setProperty("--s", Math.min(1, w / 360).toFixed(4));
  });
}
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.querySelector(".wrap"));
window.addEventListener("resize", fit);

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "v-design" || b.id === "v-screen") { state.view = b.id === "v-design" ? "design" : "screen"; }
  else if (b.dataset.look) { state.look = +b.dataset.look; }
  else if (b.dataset.screen) { state.screen = b.dataset.screen; }
  else if (b.dataset.pickAll) { const id = +b.dataset.pickAll; state.all = state.all === id ? null : id; }
  else if (b.dataset.pickScreen) { const id = +b.dataset.pickScreen; state.per[state.screen] = state.per[state.screen] === id ? undefined : id; }
  else if (b.id === "ch-clear") { state.all = null; state.per = {}; $("ch-fallback").hidden = true; }
  else if (b.id === "ch-copy") {
    const txt = "Redbean mobile design choice. " + summary().join(". ") + ".";
    const fb = () => { const ta = $("ch-fallback"); ta.value = txt; ta.hidden = false; ta.focus(); ta.select(); };
    try {
      navigator.clipboard.writeText(txt).then(() => { b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy choice"), 1600); }, fb);
    } catch (err) { fb(); }
    return;
  } else return;
  save(); render();
});

render();
</script>
